services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?set OPENWEATHER_API_KEY in .env}
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: weather
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 10s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata: